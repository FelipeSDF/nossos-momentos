<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nossos Momentos</title>
<meta name="apple-mobile-web-app-title" content="Nossos Momentos">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#6b1525">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #6b1525; }
  /* o álbum ocupa a tela toda; ele mesmo se afasta da ilha/notch com as medidas enviadas abaixo */
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<!-- o álbum mora no Google Apps Script; esta página só dá o ícone e o nome na tela inicial -->
<iframe id="app" allow="autoplay; fullscreen; clipboard-write; encrypted-media; picture-in-picture; geolocation" title="Nossos Momentos"></iframe>
<script>
  // Dentro do iframe o iPhone não informa onde ficam a ilha/notch e a barra de gestos,
  // então medimos aqui (vale para qualquer modelo) e mandamos para o álbum.
  (function () {
    var APP = 'https://script.google.com/macros/s/AKfycbzkK7yRx_pTE1kDqLAFL0Jhb5qNO3q_4qMVSxHDIIkaHgMvfQgZHahi-c6qWzWRNgyg/exec';

    function measure(side) {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;left:0;top:0;width:1px;visibility:hidden;height:env(safe-area-inset-' + side + ')';
      document.body.appendChild(d);
      var h = d.offsetHeight;
      d.remove();
      return h;
    }

    var top = measure('top'), bottom = measure('bottom');
    var standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

    // reserva: se o aparelho não informar, usa as medidas conhecidas pelo tamanho da tela
    if (standalone && /iPhone/.test(navigator.userAgent) && top < 20) {
      var h = Math.max(screen.width, screen.height);
      var island = [852, 874, 932, 956].indexOf(h) >= 0;   // iPhones com Dynamic Island
      top = island ? (h >= 932 ? 62 : 59) : (h >= 812 ? 47 : 20);
      bottom = h >= 812 ? 34 : 0;
    }

    document.getElementById('app').src = APP + '?sat=' + top + '&sab=' + bottom;
  })();

  // Guarda o login do álbum aqui, porque o iPhone apaga a memória do iframe ao fechar o app.
  // Só conversa com o álbum (endereços *.googleusercontent.com do Google Apps Script).
  window.addEventListener('message', function (e) {
    if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin) || !e.data) return;
    var KEY = 'nm_auth';
    try {
      if (e.data.nm === 'reload') { location.reload(); return; }   // o álbum avisou que tem versão nova
      if (e.data.nm === 'getAuth') {
        var saved = localStorage.getItem(KEY);
        e.source.postMessage({ nm: 'auth', auth: saved ? JSON.parse(saved) : null }, e.origin);
      } else if (e.data.nm === 'setAuth') {
        if (e.data.auth && e.data.auth.user) localStorage.setItem(KEY, JSON.stringify(e.data.auth));
        else localStorage.removeItem(KEY);
      }
    } catch (err) {}
  });
</script>
</body>
</html>
