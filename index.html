<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nossos Momentos</title>
<meta name="apple-mobile-web-app-title" content="Nossos Momentos">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#6b1525">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* topo vinho (atrás do relógio/bateria), embaixo a cor de fundo do álbum (atrás da barra de gestos) */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f8f0ee; }
  body::before { content: ''; position: fixed; left: 0; right: 0; top: 0; height: 50%; background: #6b1525; }
  @media (prefers-color-scheme: dark) { html, body { background: #170a0d; } }
  /* o álbum fica só na área segura da tela, sem entrar embaixo do relógio nem da barra de gestos */
  iframe {
    position: fixed; display: block; border: 0;
    --t: max(env(safe-area-inset-top), var(--top, 0px));
    --b: max(env(safe-area-inset-bottom), var(--bottom, 0px));
    top: var(--t); bottom: var(--b);
    left: env(safe-area-inset-left); right: env(safe-area-inset-right);
    width: calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right));
    height: calc(100% - var(--t) - var(--b));
  }
</style>
</head>
<body>
<!-- o álbum mora no Google Apps Script; esta página só dá o ícone e o nome na tela inicial -->
<iframe src="https://script.google.com/macros/s/AKfycbzkK7yRx_pTE1kDqLAFL0Jhb5qNO3q_4qMVSxHDIIkaHgMvfQgZHahi-c6qWzWRNgyg/exec"
        allow="autoplay; fullscreen; clipboard-write; encrypted-media; picture-in-picture"
        title="Nossos Momentos"></iframe>
<script>
  // se o iPhone (modo app) não informar a área da ilha/relógio, usa uma margem segura fixa
  (function () {
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;width:1px;visibility:hidden;height:env(safe-area-inset-top)';
    document.body.appendChild(probe);
    var measured = probe.offsetHeight;
    probe.remove();
    var standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
    var iphone = /iPhone/.test(navigator.userAgent);
    if (standalone && iphone && measured < 20) {
      document.documentElement.style.setProperty('--top', '62px');
      document.documentElement.style.setProperty('--bottom', '30px');
    }
  })();
</script>
</body>
</html>
